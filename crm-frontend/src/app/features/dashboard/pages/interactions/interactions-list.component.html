<mat-card class="event-card">
  <div class="header">
    <h2>My Interactions</h2>
    <button mat-flat-button color="primary" (click)="schedule()">+ Schedule</button>
  </div>

  <mat-form-field appearance="outline" class="search-field" floatLabel="always">
    <mat-label>Quick filter</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Type to search...">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="table-container">
    <table mat-table [dataSource]="interactions" class="mat-elevation-z2">

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let i">{{ i.type }}</td>
      </ng-container>

      <ng-container matColumnDef="company">
        <th mat-header-cell *matHeaderCellDef>Company</th>
        <td mat-cell *matCellDef="let i">{{ i.companyName || i.companyId }}</td>
      </ng-container>

      <ng-container matColumnDef="contact">
        <th mat-header-cell *matHeaderCellDef>Contact</th>
        <td mat-cell *matCellDef="let i">{{ i.contactPersonName || i.contactPersonId }}</td>
      </ng-container>

      <ng-container matColumnDef="scheduledAt">
        <th mat-header-cell *matHeaderCellDef>When</th>
        <td mat-cell *matCellDef="let i">{{ i.scheduledAt | date:'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let i">{{ statusOf(i) }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let i">
          <button mat-icon-button color="primary" (click)="edit(i.id)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="accent" (click)="complete(i.id)"><mat-icon>task_alt</mat-icon></button>
          <button mat-icon-button color="warn" (click)="remove(i.id)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <div *ngIf="interactions.length === 0" class="empty-state">No interactions yet.</div>
  </div>

  <div class="paginator-wrapper">
    <mat-paginator
      [length]="totalElements"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="[5,10,20]"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
</mat-card>
