<mat-card class="company-card">
  <mat-card-title class="header">
    Company List
    <button mat-flat-button color="primary" (click)="onAddCompany()">+ Add Company</button>
  </mat-card-title>
  <div class="table-container">
    <table mat-table [dataSource]="companies" class="mat-elevation-z8">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name</th>
        <td mat-cell *matCellDef="let c"> {{ c.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email</th>
        <td mat-cell *matCellDef="let c"> {{ c.email || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="phoneNumber">
        <th mat-header-cell *matHeaderCellDef> Phone</th>
        <td mat-cell *matCellDef="let c"> {{ c.phoneNumber || '-' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [length]="totalElements"
                   [pageSize]="pageSize"
                   [pageSizeOptions]="[5, 10, 25]"
                   (page)="onPageChange($event)">
    </mat-paginator>
  </div>
</mat-card>
