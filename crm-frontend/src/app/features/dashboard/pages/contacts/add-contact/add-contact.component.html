<mat-card class="company-card">
  <mat-card-title>Add Contact</mat-card-title>
  <form [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="fill" class="half-width">
      <mat-label>First name *</mat-label>
      <input matInput formControlName="firstName">
      <mat-error *ngIf="form.get('firstName')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="half-width">
      <mat-label>Last name *</mat-label>
      <input matInput formControlName="lastName">
      <mat-error *ngIf="form.get('lastName')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Position</mat-label>
      <input matInput formControlName="position">
    </mat-form-field>

    <mat-form-field appearance="fill" class="half-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email">
      <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="half-width">
      <mat-label>Phone</mat-label>
      <input matInput formControlName="phoneNumber" placeholder="+48700111222">
      <mat-error *ngIf="form.get('phoneNumber')?.hasError('pattern')">+ and 7–15 digits</mat-error>
      <mat-error *ngIf="form.hasError('oneRequired')">Provide email or phone</mat-error>
    </mat-form-field>

    <div class="btn-row">
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Save</button>
      <button mat-button type="button" [routerLink]="['/dashboard/companies', companyId, 'contacts']">Cancel</button>
    </div>
  </form>
</mat-card>
