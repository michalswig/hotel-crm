<mat-card>
  <div class="header">
    <h2>Contacts — {{ companyName }}</h2>
    <button mat-flat-button color="primary" (click)="onAdd()">+ Add Contact</button>
  </div>

  <table mat-table [dataSource]="contacts" class="mat-elevation-z2">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let c">{{ c.firstName }} {{ c.lastName }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let c">{{ c.email || '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let c">{{ c.phoneNumber || '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef>Position</th>
      <td mat-cell *matCellDef="let c">{{ c.position || '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="primary">
      <th mat-header-cell *matHeaderCellDef>Primary</th>
      <td mat-cell *matCellDef="let c">
        <button mat-icon-button (click)="setPrimary(c.id)" [disabled]="primaryId === c.id">
          <mat-icon>{{ primaryId === c.id ? 'star' : 'star_border' }}</mat-icon>
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let c">
        <button mat-icon-button color="primary" (click)="onEdit(c.id)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(c.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [length]="total" [pageIndex]="pageIndex" [pageSize]="pageSize"
                 [pageSizeOptions]="[5,10,20]" showFirstLastButtons
                 (page)="onPage($event)">
  </mat-paginator>
</mat-card>
