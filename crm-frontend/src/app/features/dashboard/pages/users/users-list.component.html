<mat-card>
  <div class="header">
    <h2>Users</h2>
    <button mat-raised-button color="primary" (click)="add()">
      <mat-icon>add</mat-icon>
      New User
    </button>
  </div>

  <table mat-table [dataSource]="users" class="mat-elevation-z2" *ngIf="users && users.length > 0; else empty">
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef> Username </th>
      <td mat-cell *matCellDef="let u"> {{u.username}} </td>
    </ng-container>

    <ng-container matColumnDef="hotel">
      <th mat-header-cell *matHeaderCellDef> Hotel </th>
      <td mat-cell *matCellDef="let u"> {{u.hotelName || '-'}} </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Role </th>
      <td mat-cell *matCellDef="let u"> {{u.role}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let u">
        <button mat-icon-button color="primary" (click)="edit(u.id)" title="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="remove(u.id)" title="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <ng-template #empty>
    <div class="empty-state">No users yet.</div>
  </ng-template>
</mat-card>
