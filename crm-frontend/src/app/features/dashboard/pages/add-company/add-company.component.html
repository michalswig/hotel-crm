<mat-card class="company-card">
  <mat-card-title>{{ isEditMode ? 'Edit Company' : 'Add Company' }}</mat-card-title>

  <form [formGroup]="form" (ngSubmit)="save()">

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Company Name *</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="half-width">
      <mat-label>Tax ID</mat-label>
      <input matInput formControlName="taxId" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="half-width">
      <mat-label>Industry *</mat-label>
      <mat-select formControlName="industry">
        <mat-option *ngFor="let ind of industries" [value]="ind">
          {{ ind }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('industry')?.hasError('required')">
        Industry is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="half-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" />
      <mat-error *ngIf="form.get('email')?.hasError('email')">
        Invalid email format
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="half-width">
      <mat-label>Phone Number</mat-label>
      <input matInput formControlName="phoneNumber" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Website</mat-label>
      <input matInput formControlName="website" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Address</mat-label>
      <input matInput formControlName="address" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="third-width">
      <mat-label>Postal Code</mat-label>
      <input matInput formControlName="postalCode" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="third-width">
      <mat-label>City</mat-label>
      <input matInput formControlName="city" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="third-width">
      <mat-label>Country</mat-label>
      <input matInput formControlName="country" />
    </mat-form-field>

    <div class="btn-row">
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
        Save
      </button>
      <button mat-button type="button" routerLink="/dashboard/companies">
        Cancel
      </button>
    </div>
  </form>
</mat-card>
