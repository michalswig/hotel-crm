databaseChangeLog:
  - changeSet:
      id: 3.1
      author: mike
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: type
                  type: VARCHAR(255)

              - column:
                  name: status
                  type: VARCHAR(255)

              - column:
                  name: event_date
                  type: TIMESTAMP

              - column:
                  name: participants_number
                  type: INTEGER

              - column:
                  name: estimated_total_gross_revenue
                  type: NUMERIC(38,2)

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: company_id
                  type: BIGINT

              - column:
                  name: hotel_id
                  type: BIGINT

              - column:
                  name: created_by_user_id
                  type: BIGINT

  - changeSet:
      id: 3.2
      author: mike
      changes:
        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: company_id
            constraintName: fk_event_company
            referencedTableName: companies
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: hotel_id
            constraintName: fk_event_hotel
            referencedTableName: hotels
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: created_by_user_id
            constraintName: fk_event_user
            referencedTableName: users
            referencedColumnNames: id
