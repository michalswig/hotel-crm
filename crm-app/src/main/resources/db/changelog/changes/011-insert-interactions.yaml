# ─── append this block after the table-creation change set ──────────────────────
databaseChangeLog:
  - changeSet:
      id: seed-interactions-v2        # use a unique ID
      author: mike
      changes:
        # ── Interaction for contact_person_id = 1 ──────────────────────────────
        - insert:
            tableName: interactions
            columns:
              - column: { name: type,              value: 'CALL' }
              - column: { name: notes,             value: 'Introductory phone call to discuss needs.' }
              - column: { name: scheduled_at,      valueDate: '2025-06-27T10:00:00' }
              - column: { name: contact_person_id, valueNumeric: 1 }
              - column: { name: company_id,        valueComputed: "(SELECT company_id FROM contact_persons WHERE id = 1)" }
              - column: { name: user_id,           valueNumeric: 5 }
              - column: { name: created_at,        valueDate: '2025-06-27T10:00:00' }
              - column: { name: updated_at,        valueDate: '2025-06-27T10:00:00' }

