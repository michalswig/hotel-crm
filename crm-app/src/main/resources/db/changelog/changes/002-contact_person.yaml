databaseChangeLog:
  - changeSet:
      id: 2
      author: mike
      changes:
        - createTable:
            tableName: contact_persons
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column: { name: first_name, type: VARCHAR(255) }
              - column: { name: last_name, type: VARCHAR(255) }
              - column: { name: email, type: VARCHAR(255) }
              - column: { name: phone_number, type: VARCHAR(255) }
              - column: { name: position, type: VARCHAR(255) }
              - column: { name: created_at, type: TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMP }
              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false


        # FK: contact_persons.company_id -> companies.id
        - addForeignKeyConstraint:
            baseTableName: contact_persons
            baseColumnNames: company_id
            referencedTableName: companies
            referencedColumnNames: id
            constraintName: fk_contact_person_company

        # NOW it’s safe to add the FK for companies.primary_contact_id -> contact_persons.id
        - addForeignKeyConstraint:
            baseTableName: companies
            baseColumnNames: primary_contact_id
            referencedTableName: contact_persons
            referencedColumnNames: id
            constraintName: fk_company_primary_contact
            onDelete: SET NULL
            onUpdate: RESTRICT