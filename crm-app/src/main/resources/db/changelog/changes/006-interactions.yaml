databaseChangeLog:
  - changeSet:
      id: interactions-create
      author: mike
      changes:
        - createTable:
            tableName: interactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: contact_person_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: scheduled_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: completed_at
                  type: TIMESTAMP

              - column:
                  name: follow_up_at
                  type: TIMESTAMP

              - column:
                  name: notes
                  type: VARCHAR(2000)

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        # FKs (added separately)
        - addForeignKeyConstraint:
            baseTableName: interactions
            baseColumnNames: company_id
            referencedTableName: companies
            referencedColumnNames: id
            constraintName: fk_interaction_company
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: interactions
            baseColumnNames: contact_person_id
            referencedTableName: contact_persons
            referencedColumnNames: id
            constraintName: fk_interaction_contact_person
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: interactions
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_interaction_user
            onDelete: RESTRICT
