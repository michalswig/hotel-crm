# Application name
spring.application.name=crm-app

# Aktywny profil — nadpisz przez ENV na produkcji: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# DB config — wartości z ENV, fallback na lokalne dev
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:1019/hotelcrm}
spring.datasource.username=${DB_USERNAME:mike}
spring.datasource.password=${DB_PASSWORD:test1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JWT
jwt.secret=${JWT_SECRET}

app.cookie.secure=${COOKIE_SECURE:false}